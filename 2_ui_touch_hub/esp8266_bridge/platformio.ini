[platformio]
default_envs = esp01s

[env:esp01s]
platform = espressif8266@4.2.1
board = esp01_1m
framework = arduino
board_build.flash_mode = dout
board_build.f_flash = 40000000L
board_build.f_cpu = 80000000L
monitor_speed = 1000000
upload_speed = 115200
build_flags =
  -DBRIDGE_UART_BAUD=1000000
  -DTCP_PORT=333
  -DBRIDGE_LED_PIN=2
